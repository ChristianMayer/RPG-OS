name: Deploy ELO demo

# Builds the ELO leaderboard demo and publishes it to GitHub Pages under the
# same version folders as the docs: /main/demo/, /develop/demo/, /vX.Y.Z/demo/.
#
# The leaderboards are generated DURING this CI run: the Python Monte-Carlo
# ELO script (scripts/elo_ranking.py) plays the shipped combatants against
# each other using the native fight binary and writes JSON (a fixed seed keeps
# the result reproducible). The page itself uses the WASM package to rank a
# character entered into the form live in the browser.
#
# One-time repository settings (same as for the docs, see docs/README.md):
#   - Settings -> Actions -> General -> Workflow permissions: Read and write
#   - Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages / (root)

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]

permissions:
  contents: write # push the gh-pages branch

jobs:
  deploy-demo:
    name: Build + deploy demo
    runs-on: ubuntu-latest
    concurrency:
      # Serialize demo deploys. NOTE: the docs deploy is a separate workflow;
      # both use keep_files and write disjoint paths (/<version>/ vs
      # /<version>/demo/), so a same-push race surfaces as a loud non-fast-
      # forward failure rather than silent corruption — re-run to resolve.
      group: gh-pages-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install the native toolchain (fight binary for the ELO script)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13

      - name: Build the native fight example
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DRPG_OS_BUILD_TESTS=OFF -DRPG_OS_BUILD_DOCS=OFF \
            -DRPG_OS_BUILD_EXAMPLES=ON
          cmake --build build --target rpg_os_example_fight --parallel

      - name: Set up the Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install latest
          /tmp/emsdk/emsdk activate latest

      - name: Build the WASM assets for the demo
        run: |
          source /tmp/emsdk/emsdk_env.sh
          wasm/build.sh

      - name: Assemble the demo staging directory
        run: |
          set -euo pipefail
          STAGE="${GITHUB_WORKSPACE}/web/demo"
          mkdir -p "${STAGE}/wasm" "${STAGE}/rulesets" "${STAGE}/data"
          # The WASM assets the page loads (fetched by the browser).
          cp wasm/package/dist/rpg-os-universal.js wasm/package/dist/rpg-os-universal.wasm "${STAGE}/wasm/"
          # The rulesets the page loads at runtime (fetched, never baked into WASM).
          cp rulesets/dnd5e_srd.json rulesets/tde5e_core.json rulesets/brp_ugc.json "${STAGE}/rulesets/"
          # Leaderboards generated during this CI run by the Python ELO script.
          # Fixed seed => reproducible; rounds/games tuned to keep CI fast.
          python3 scripts/elo_ranking.py --ruleset rulesets/dnd5e_srd.json \
            --seed 20260817 --rounds 30 --games 10 --jobs 4 \
            --json "${STAGE}/data/dnd5e_srd_elo.json"
          python3 scripts/elo_ranking.py --ruleset rulesets/tde5e_core.json \
            --seed 20260817 --rounds 30 --games 10 --jobs 4 \
            --json "${STAGE}/data/tde5e_core_elo.json"
          ls -la "${STAGE}/data" "${STAGE}/wasm"

      - name: Determine the version subfolder (main / develop / vX.Y.Z)
        id: version
        run: |
          FOLDER="${GITHUB_REF#refs/heads/}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            FOLDER="${GITHUB_REF#refs/tags/}"
          fi
          echo "folder=${FOLDER}" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages (keep the docs)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/demo
          destination_dir: ${{ steps.version.outputs.folder }}/demo
          keep_files: true
