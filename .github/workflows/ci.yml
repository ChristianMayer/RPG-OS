name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # C++23 <expected> (used throughout the bookkeeping API) must come
          # from a standard library that actually provides it. GCC 13's
          # libstdc++ 13 provides it, so the GCC job uses the system libstdc++.
          # clang 18 does NOT get it from libstdc++ 13: libstdc++ 13 gates
          # <expected> behind __cpp_concepts >= 202002L, but clang 17/18
          # predefine __cpp_concepts as 201907L, which empties the whole header
          # (GCC 13 predefines 202002L — that is why the GCC job works). The
          # Ubuntu Clang job therefore uses clang's own complete C++23 standard
          # library, libc++ 18 (-stdlib=libc++), the same clang + libc++
          # pairing the macOS job already uses. Versioned compiler binaries are
          # used explicitly so each job is deterministic and cannot silently
          # fall back to an older standard library.
          - { name: Ubuntu GCC,   os: ubuntu-24.04, cc: gcc-13,    cxx: g++-13,    stdlib: libstdc++, cxxflags: "" }
          - { name: Ubuntu Clang, os: ubuntu-24.04, cc: clang-18,  cxx: clang++-18, stdlib: libc++,     cxxflags: "-stdlib=libc++" }
          - { name: macOS Clang,  os: macos-latest,  cc: clang,     cxx: clang++,   stdlib: libc++,     cxxflags: "" }

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13 clang-18
          if [ "${{ matrix.config.stdlib }}" = "libc++" ]; then
            sudo apt-get install -y libc++-18-dev libc++abi-18-dev
          fi
          g++-13 --version | head -n 1
          clang++-18 --version | head -n 1

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.config.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }}
          -DCMAKE_CXX_FLAGS=${{ matrix.config.cxxflags }}
          -DRPG_OS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  codegen-sync:
    name: Codegen outputs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Regenerate into a temp dir
        run: >
          python3 codegen/rpg_os_codegen.py --ruleset rulesets/dnd5e_srd.json --out /tmp/codegen
          && python3 codegen/rpg_os_codegen.py --ruleset rulesets/tde5e_core.json --out /tmp/codegen
          && python3 codegen/rpg_os_codegen.py --ruleset rulesets/brp_ugc.json --out /tmp/codegen

      - name: Format regenerated output like the committed files
        run: |
          cp .clang-format /tmp/codegen/
          clang-format -i /tmp/codegen/*.hpp

      - name: Diff against committed generated/
        run: |
          cp /tmp/codegen/*.hpp generated/
          git diff --exit-code generated/

  ruleset-validation:
    name: Rulesets conform to the JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate rulesets against ruleset.schema.json
        run: python3 codegen/validate_ruleset.py rulesets/dnd5e_srd.json rulesets/tde5e_core.json rulesets/brp_ugc.json

